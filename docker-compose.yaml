# Optional host-network sidecar next to nginx.
# Intended run is `python main.py` on the same host/netns as nginx.
# Do not publish 8080 or 8711.

services:
  glass-peer:
    build:
      context: ./glass-peer
      dockerfile: Dockerfile
    image: glass-peer:latest
    container_name: glass-peer
    restart: unless-stopped
    network_mode: host
    environment:
      - GLASS_PAIR_USERNAME=${GLASS_PAIR_USERNAME:?Set GLASS_PAIR_USERNAME}
      - GLASS_PAIR_PASSWORD=${GLASS_PAIR_PASSWORD:?Set GLASS_PAIR_PASSWORD}
      - GLASS_PUBLIC_WSS_URL=${GLASS_PUBLIC_WSS_URL:-}
      - GLASS_INVITE_TTL=${GLASS_INVITE_TTL:-300}
      - GLASS_DATA_DIR=/data
    volumes:
      - glass-data:/data

volumes:
  glass-data:
