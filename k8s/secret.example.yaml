# Copy this file to secret.yaml and replace placeholder values with real tokens.
# DO NOT commit secret.yaml to git.
#
# Required tokens for the inbox API:
# - GLASS_PHONE_TOKEN: used by Nash (Android) to POST as jamie and GET /v0/replies
# - GLASS_PANE_TOKEN: used by Ashleigh to POST as ashleigh and GET /v0/messages
#
# Apply with: kubectl apply -f k8s/secret.yaml

---
# Image pull secret for private GHCR image
# Create with: kubectl create secret docker-registry ghcr-pull-secret \
#   --docker-server=ghcr.io \
#   --docker-username=YOUR_GITHUB_USERNAME \
#   --docker-password=YOUR_GITHUB_PAT \
#   --docker-email=YOUR_EMAIL
#
# Or use gh CLI:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=$(gh api user --jq .login) \
#     --docker-password=$(gh auth token)
#
# PAT needs read:packages scope for private images.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  labels:
    app: glass-inbox
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "YOUR_GITHUB_USERNAME",
          "password": "YOUR_GITHUB_PAT_WITH_READ_PACKAGES",
          "email": "your-email@example.com"
        }
      }
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: glass-inbox-tokens
  labels:
    app: glass-inbox
type: Opaque
stringData:
  GLASS_PHONE_TOKEN: "change-me-phone"
  GLASS_PANE_TOKEN: "change-me-pane"

---
# Optional: Grok auth for STT/TTS (grok_build format)
# Mount at /home/node/.grok/auth.json
# Format: {"sso_cookie": "...", "auth_token": "..."}
apiVersion: v1
kind: Secret
metadata:
  name: glass-grok-auth
  labels:
    app: glass-inbox
type: Opaque
stringData:
  auth.json: |
    {
      "sso_cookie": "change-me",
      "auth_token": "change-me"
    }

---
# Optional: xAI OAuth for STT/TTS
# Mount at /data/secrets/oauth.json
# Format depends on xAI OAuth flow
apiVersion: v1
kind: Secret
metadata:
  name: glass-xai-oauth
  labels:
    app: glass-inbox
type: Opaque
stringData:
  oauth.json: |
    {
      "access_token": "change-me",
      "refresh_token": "change-me"
    }
