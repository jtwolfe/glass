# Copy this file to secret.yaml and replace placeholder values.
# DO NOT commit secret.yaml to git.
#
# Apply with: kubectl apply -f k8s/secret.yaml

---
# Image pull secret for private GHCR image
# Create with: kubectl create secret docker-registry ghcr-pull-secret \
#   --docker-server=ghcr.io \
#   --docker-username=YOUR_GITHUB_USERNAME \
#   --docker-password=YOUR_GITHUB_PAT \
#   --docker-email=YOUR_EMAIL
#
# Or use gh CLI:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=$(gh api user --jq .login) \
#     --docker-password=$(gh auth token)
#
# PAT needs read:packages scope for private images.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  labels:
    app: glass-inbox
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "YOUR_GITHUB_USERNAME",
          "password": "YOUR_GITHUB_PAT_WITH_READ_PACKAGES",
          "email": "your-email@example.com"
        }
      }
    }

---
# App secrets for glass-inbox
#
# Required:
# - GLASS_PHONE_TOKEN: Bearer token for phone (Nash) - POST as jamie, GET /v0/replies
# - GLASS_PANE_TOKEN: Bearer token for pane (Ashleigh) - POST as ashleigh, GET /v0/messages
#
# Optional:
# - GLASS_RELAY_ADDRS: Comma-separated libp2p relay multiaddrs for hole-punching rendezvous.
#   Also used for short-code-only pairing: inbox publishes invite on /glass/pair/<code> topic.
#   The inbox does NOT run a relay server.
# - GLASS_ENABLE_P2P: Set to "false" to disable libp2p (HTTP-only mode for testing).
#
# Invite is minted automatically on startup:
# - 8-char Crockford code + 32-byte PSK + 15-min expiry
# - Printed to logs (QR JSON + short code)
# - Consumed on first successful /glass/inbox/v0 connection
#
apiVersion: v1
kind: Secret
metadata:
  name: glass-inbox-secrets
  labels:
    app: glass-inbox
type: Opaque
stringData:
  GLASS_PHONE_TOKEN: "change-me-phone"
  GLASS_PANE_TOKEN: "change-me-pane"
  # GLASS_RELAY_ADDRS: "/ip4/RELAY_IP/tcp/4001/p2p/RELAY_PEER_ID"
