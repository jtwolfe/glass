apiVersion: apps/v1
kind: Deployment
metadata:
  name: glass-inbox
  labels:
    app: glass-inbox
spec:
  replicas: 1  # SQLite is not multi-writer
  selector:
    matchLabels:
      app: glass-inbox
  template:
    metadata:
      labels:
        app: glass-inbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: glass-inbox
          image: ghcr.io/jtwolfe/glass-inbox:0.1.0
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: libp2p
              containerPort: 4001
              protocol: TCP
          env:
            - name: GLASS_DB_PATH
              value: /data/glass.db
            - name: GLASS_P2P_PORT
              value: "4001"
          envFrom:
            - secretRef:
                name: glass-inbox-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /v0/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v0/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: glass-inbox-data
