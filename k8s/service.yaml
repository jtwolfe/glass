apiVersion: v1
kind: Service
metadata:
  name: glass-inbox
  labels:
    app: glass-inbox
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
    - port: 4001
      targetPort: 4001
      protocol: TCP
      name: libp2p
  selector:
    app: glass-inbox
