# Example secret for glass-auth
# DO NOT deploy this file directly - create your own secret with secure values
#
# Create the secret with:
#   kubectl create secret generic glass-auth \
#     --namespace=<your-namespace> \
#     --from-literal=pair-username=admin \
#     --from-literal=pair-password=$(openssl rand -base64 32)
#
# Or apply this file after replacing the values:
#   kubectl apply -f secret.yaml

{{- if false }}
# This is disabled by default (the if false above)
# Remove the if/end to use this as a template
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.existingSecret }}
  labels:
    {{- include "glass.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.usernameKey }}: "change-me"
  {{ .Values.auth.passwordKey }}: "change-me-to-a-strong-random-password"
{{- end }}
