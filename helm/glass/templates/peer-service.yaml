apiVersion: v1
kind: Service
metadata:
  name: {{ include "glass.fullname" . }}-peer
  labels:
    {{- include "glass.peer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.peerPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "glass.peer.selectorLabels" . | nindent 4 }}
