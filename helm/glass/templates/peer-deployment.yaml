apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glass.fullname" . }}-peer
  labels:
    {{- include "glass.peer.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "glass.peer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "glass.peer.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: peer
          image: "{{ .Values.peer.image.repository }}:{{ .Values.peer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: GLASS_PAIR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.usernameKey }}
            - name: GLASS_PAIR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.passwordKey }}
            - name: GLASS_NTFY_INTERNAL_URL
              value: {{ include "glass.ntfy.internalUrl" . | quote }}
            - name: GLASS_NTFY_PUBLIC_URL
              value: {{ include "glass.ntfy.publicUrl" . | quote }}
            - name: GLASS_STUN_SERVER
              value: {{ .Values.peer.stunServer | quote }}
            - name: GLASS_INVITE_TTL
              value: {{ .Values.peer.inviteTtl | quote }}
            - name: GLASS_DATA_DIR
              value: "/data"
            - name: GLASS_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.peer.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "glass.fullname" . }}-peer-data
