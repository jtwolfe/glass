{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "glass.fullname" . }}
  labels:
    {{- include "glass.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # ntfy signaling (with path prefix strip)
          - path: {{ .Values.ingress.ntfyPathPrefix }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "glass.fullname" . }}-ntfy
                port:
                  number: {{ .Values.service.ntfyPort }}
          # glass-peer API
          - path: /pair
            pathType: Exact
            backend:
              service:
                name: {{ include "glass.fullname" . }}-peer
                port:
                  number: {{ .Values.service.peerPort }}
          - path: /qr
            pathType: Exact
            backend:
              service:
                name: {{ include "glass.fullname" . }}-peer
                port:
                  number: {{ .Values.service.peerPort }}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "glass.fullname" . }}-peer
                port:
                  number: {{ .Values.service.peerPort }}
{{- end }}
